<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Editable Faculty Identity Card</title><link rel="stylesheet" href="/assets/styles.css">
<style>
  * {
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  body {
    background-color: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .id-card-container {
    width: 350px;
    height: 520px;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid #e0e0e0;
    position: relative;
  }
  .card-header {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #ffffff;
    text-align: center;
    padding: 15px 10px;
  }
  .institution-name {
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    outline: none;
    letter-spacing: 0.5px;
  }
  .card-subtitle {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 4px;
    color: #d1e8ff;
  }
  .photo-section {
    display: flex;
    justify-content: center;
    margin-top: 15px;
  }
  .photo-wrapper {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid #2a5298;
    overflow: hidden;
    position: relative;
    background-color: #e9ecef;
    cursor: pointer;
  }
  .photo-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .photo-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #6c757d;
    font-size: 11px;
    text-align: center;
    padding: 10px;
  }
  #file-input {
    display: none;
  }
  .card-body {
    padding: 15px 20px;
    flex-grow: 1;
  }
  .faculty-name {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #1e3c72;
    margin-bottom: 2px;
    outline: none;
  }
  .faculty-subject {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: #555;
    margin-bottom: 15px;
    outline: none;
  }
  .info-group {
    font-size: 12px;
    color: #333;
    line-height: 1.5;
  }
  .info-row {
    display: flex;
    margin-bottom: 8px;
  }
  .info-label {
    font-weight: 700;
    width: 70px;
    color: #1e3c72;
    flex-shrink: 0;
  }
  .info-value {
    flex-grow: 1;
    outline: none;
  }
  .editable:hover, .editable:focus {
    background-color: #f8f9fa;
    border-bottom: 1px dashed #2a5298;
  }
  .card-footer {
    background-color: #1e3c72;
    height: 12px;
    width: 100%;
  }
</style>
</head>
<body>

<div class="id-card-container">
  <div class="card-header">
    <div class="institution-name editable" contenteditable="true">University Name</div>
    <div class="card-subtitle">Faculty Identity Card</div>
  </div>

  <div class="photo-section">
    <div class="photo-wrapper" onclick="document.getElementById('file-input').click();" title="Click to upload photo">
      <div class="photo-placeholder" id="placeholder-text">Click to upload photo</div>
      <img id="photo-preview" src="/about-me.png" alt="Faculty Photo" style="display:none;">
    </div>
    <input type="file" id="file-input" accept="image/*" onchange="loadPhoto(event)">
  </div>

  <div class="card-body">
    <div class="faculty-name editable" contenteditable="true">Dr. Jane Doe</div>
    <div class="faculty-subject editable" contenteditable="true">Department of Computer Science</div>

    <div class="info-group">
      <div class="info-row">
        <span class="info-label">Contact:</span>
        <span class="info-value editable" contenteditable="true">+1 (555) 019-2834</span>
      </div>
      <div class="info-row">
        <span class="info-label">Address:</span>
        <span class="info-value editable" contenteditable="true">123 Academic Way, Campus Box 402, Boston, MA</span>
      </div>
    </div>
  </div>

  <div class="card-footer"></div>
</div>

<script>
  function loadPhoto(event) {
    const reader = new FileReader();
    reader.onload = function() {
      const output = document.getElementById('photo-preview');
      const placeholder = document.getElementById('placeholder-text');
      output.src = reader.result;
      output.style.display = 'block';
      placeholder.style.display = 'none';
    };
    reader.readAsDataURL(event.target.files[0]);
  }
</script>

</body>
</html>
