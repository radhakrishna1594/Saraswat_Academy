name: Sync Home Tutor Area Links
on:
  push:
    branches: [main]
    paths:
      - 'home-tutor/best-tutor-area-wise/*.html'
      - 'scripts/sync_area_links.py'
      - '.github/workflows/sync-area-links.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/sync_area_links.py
      - name: Commit static area links
        run: |
          if git diff --quiet; then
            echo "All area pages already contain the complete area directory."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-tutor/best-tutor-area-wise/*.html
          git commit -m "Sync all area links on home tutor pages"
          git push
