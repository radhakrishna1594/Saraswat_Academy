name: One-time SEO normalization

on:
  push:
    paths:
      - '.github/workflows/seo-normalize.yml'

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize SEO
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, html

          SITE = "https://www.saraswatacademy.in"
          SKIP = {
              "student/login.html", "student/signup.html", "student/verify-email.html",
              "student/dashboard.html", "student/test.html", "thank-you.html",
              "thank-you-tutor.html", "under-construction.html",
              "Formula_sheets/maths_formula.html"
          }

          def clean_text(s):
              s = re.sub(r"<[^>]+>", " ", s)
              s = html.unescape(s)
              return re.sub(r"\s+", " ", s).strip()

          def esc(s):
              return html.escape(s, quote=True)

          changed = 0
          for p in Path(".").rglob("*.html"):
              rel = p.as_posix().lstrip("./")
              if rel in SKIP or p.stat().st_size == 0:
                  continue
              s = p.read_text(encoding="utf-8", errors="ignore")
              original = s

              # Remove obsolete meta keywords.
              s = re.sub(r"\s*<meta\b[^>]*\bname=[\"']keywords[\"'][^>]*>\s*", "\n", s, flags=re.I)

              # Normalize the old production domain everywhere in HTML.
              s = re.sub(r"https?://(?:www\.)?saraswatacademy\.com", SITE, s, flags=re.I)

              # Normalize canonical: remove all existing canonical tags, then add exactly one.
              canonical = SITE + "/" if rel == "index.html" else SITE + "/" + rel
              canon_tag = f'<link rel="canonical" href="{canonical}">'
              canon_re = re.compile(r"<link\b[^>]*\brel=[\"']canonical[\"'][^>]*>", re.I)
              s = canon_re.sub("", s)
              m = re.search(r"<head\b[^>]*>", s, re.I)
              if m:
                  s = s[:m.end()] + "\n  " + canon_tag + s[m.end():]

              # Normalize og:url to exactly one tag matching canonical.
              og_tag = f'<meta property="og:url" content="{canonical}">'
              og_re = re.compile(r"<meta\b[^>]*\bproperty=[\"']og:url[\"'][^>]*>", re.I)
              s = og_re.sub("", s)
              m = re.search(r"<head\b[^>]*>", s, re.I)
              if m:
                  s = s[:m.end()] + "\n  " + og_tag + s[m.end():]

              # Add a useful description only when one is genuinely missing.
              desc_re = re.compile(r"<meta\b[^>]*\bname=[\"']description[\"'][^>]*>", re.I)
              if not desc_re.search(s):
                  tm = re.search(r"<title\b[^>]*>(.*?)</title>", s, re.I | re.S)
                  hm = re.search(r"<h1\b[^>]*>(.*?)</h1>", s, re.I | re.S)
                  basis = clean_text(hm.group(1) if hm else (tm.group(1) if tm else rel.rsplit("/",1)[-1].replace(".html","").replace("-"," ")))
                  basis = re.sub(r"\s*\|\s*Saraswat Academy.*$", "", basis, flags=re.I).strip()
                  desc = f"{basis}. Get clear explanations, NCERT solutions, notes and exam-oriented study material from Saraswat Academy."
                  if len(desc) > 160:
                      desc = desc[:157].rsplit(" ",1)[0] + "..."
                  m = re.search(r"<head\b[^>]*>", s, re.I)
                  if m:
                      s = s[:m.end()] + '\n  <meta name="description" content="' + esc(desc) + '">' + s[m.end():]

              if s != original:
                  p.write_text(s, encoding="utf-8")
                  changed += 1

          print(f"Changed HTML files: {changed}")
          PY

          git config user.name "Saraswat Academy SEO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No SEO changes required."
          else
            git commit -m "Automated SEO normalization [skip ci]"
            git push
          fi


          echo "=== FINAL SEO AUDIT ==="
          python3 <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET

          SITE="https://www.saraswatacademy.in"
          SKIP={"student/login.html","student/signup.html","student/verify-email.html","student/dashboard.html","student/test.html","thank-you.html","thank-you-tutor.html","under-construction.html","Formula_sheets/maths_formula.html","header.html","footer.html"}
          html_files=[p for p in Path(".").rglob("*.html") if p.stat().st_size>0]
          indexable=[p for p in html_files if p.as_posix().lstrip("./") not in SKIP and "noindex" not in p.read_text(encoding="utf-8",errors="ignore").lower()]
          problems={"missing_title":[],"duplicate_title":[],"missing_description":[],"duplicate_description":[],"missing_canonical":[],"wrong_canonical":[],"missing_og":[],"wrong_og":[],"keywords":[],"old_domain":[],"empty_href":[]}
          for p in indexable:
              rel=p.as_posix().lstrip("./"); s=p.read_text(encoding="utf-8",errors="ignore")
              expected=SITE+"/" if rel=="index.html" else SITE+"/"+rel
              for key,pat in [
                ("missing_title",r"<title\b[^>]*>.*?</title>"),
                ("missing_description",r"<meta\b[^>]*\bname=[\"']description[\"'][^>]*>"),
                ("missing_canonical",r"<link\b[^>]*\brel=[\"']canonical[\"'][^>]*>"),
                ("missing_og",r"<meta\b[^>]*\bproperty=[\"']og:url[\"'][^>]*>")
              ]:
                  if not re.search(pat,s,re.I|re.S): problems[key].append(rel)
              for key,pat in [("duplicate_title",r"<title\b[^>]*>.*?</title>"),("duplicate_description",r"<meta\b[^>]*\bname=[\"']description[\"'][^>]*>")]:
                  if len(re.findall(pat,s,re.I|re.S))!=1: problems[key].append(rel)
              cm=re.search(r"<link\b[^>]*\brel=[\"']canonical[\"'][^>]*\bhref=[\"']([^\"']+)",s,re.I)
              if cm and cm.group(1)!=expected: problems["wrong_canonical"].append(rel)
              om=re.search(r"<meta\b[^>]*\bproperty=[\"']og:url[\"'][^>]*\bcontent=[\"']([^\"']+)",s,re.I)
              if om and om.group(1)!=expected: problems["wrong_og"].append(rel)
              if re.search(r"<meta\b[^>]*\bname=[\"']keywords[\"']",s,re.I): problems["keywords"].append(rel)
              if "saraswatacademy.com" in s.lower(): problems["old_domain"].append(rel)
              if re.search(r"<a\b[^>]*\bhref=[\"']\s*[\"']",s,re.I): problems["empty_href"].append(rel)
          print("Indexable HTML:",len(indexable))
          for k,v in problems.items():
              print(k, len(v))
              if v:
                  print("  " + "\\n  ".join(v))
          sm=Path("sitemap.xml").read_text(encoding="utf-8",errors="ignore")
          locs=re.findall(r"<loc>(.*?)</loc>",sm,re.I|re.S)
          print("Sitemap URLs:",len(locs),"duplicates:",len(locs)-len(set(locs)))
          repo=set(p.as_posix().lstrip("./") for p in html_files)
          missing=[]
          for u in locs:
              path=u.replace(SITE+"/","")
              if u==SITE+"/": path="index.html"
              if path not in repo: missing.append(path)
          print("Sitemap missing files:",len(missing))
          print("=== END SEO AUDIT ===")
          PY
