<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Reverse engineering process</title>
  <desc id="desc">Four stages show an existing product being observed, evidence being analysed, components being mapped, and the explanation being tested and documented.</desc>
  <rect width="960" height="260" rx="22" fill="#f8fafc"/>
  <text x="480" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#17365d">FROM EXISTING SYSTEM TO UNDERSTANDING</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="28" y="67" width="194" height="148" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="125" cy="101" r="19" fill="#dbeafe"/>
    <path d="M116 101h18M125 92v18" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
    <text x="125" y="142" font-size="16" font-weight="700" fill="#17365d">1. Observe</text>
    <text x="125" y="164" font-size="12" fill="#475569">Start with the</text>
    <text x="125" y="180" font-size="12" fill="#475569">existing product</text>

    <path d="M228 140h23m-7 -7 7 7 -7 7" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="258" y="67" width="194" height="148" rx="16" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <circle cx="355" cy="101" r="19" fill="#ccfbf1"/>
    <circle cx="351" cy="97" r="7" fill="none" stroke="#0f766e" stroke-width="3"/>
    <path d="m356 102 7 7" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
    <text x="355" y="142" font-size="16" font-weight="700" fill="#17365d">2. Analyse</text>
    <text x="355" y="164" font-size="12" fill="#475569">Inspect evidence</text>
    <text x="355" y="180" font-size="12" fill="#475569">and behaviour</text>

    <path d="M458 140h23m-7 -7 7 7 -7 7" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="488" y="67" width="194" height="148" rx="16" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <circle cx="585" cy="101" r="19" fill="#fef3c7"/>
    <rect x="574" y="91" width="9" height="9" rx="2" fill="#b45309"/>
    <rect x="587" y="91" width="9" height="9" rx="2" fill="#b45309"/>
    <rect x="574" y="103" width="9" height="9" rx="2" fill="#b45309"/>
    <rect x="587" y="103" width="9" height="9" rx="2" fill="#b45309"/>
    <text x="585" y="142" font-size="16" font-weight="700" fill="#17365d">3. Map</text>
    <text x="585" y="164" font-size="12" fill="#475569">Connect components</text>
    <text x="585" y="180" font-size="12" fill="#475569">and infer the design</text>

    <path d="M688 140h23m-7 -7 7 7 -7 7" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="718" y="67" width="214" height="148" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="825" cy="101" r="19" fill="#ede9fe"/>
    <path d="m815 101 7 7 14 -15" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="825" y="142" font-size="16" font-weight="700" fill="#17365d">4. Test &amp; document</text>
    <text x="825" y="164" font-size="12" fill="#475569">Check your explanation</text>
    <text x="825" y="180" font-size="12" fill="#475569">and record the findings</text>
  </g>
  <text x="480" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">Repeat the cycle whenever new evidence changes your understanding.</text>
</svg>
