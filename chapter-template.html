<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saraswat Academy | Chapter Template</title>
<meta name="description" content="Reusable chapter template powered by JSON.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/chapter.css">
</head>
<body>

<header id="site-header"></header>

<nav id="breadcrumb" aria-label="Breadcrumb"></nav>

<main id="chapter-page">

    <section id="hero">
        <span id="chapter-class"></span>
        <h1 id="chapter-title">Loading...</h1>
        <p id="chapter-tagline"></p>
    </section>

    <nav id="quick-nav"></nav>

    <section id="chapter-overview"></section>

    <section id="learning-outcomes"></section>

    <section id="important-topics"></section>

    <section id="formula-box"></section>

    <section id="page-content">
        <!-- JS renders all dynamic sections here -->

        <!-- Example:
        Notes
        Examples
        Exercise
        MCQs
        Assertion & Reason
        Case Study
        Worksheet
        HOTS
        PYQs
        Mind Map
        Videos
        Downloads
        FAQ
        -->
    </section>

    <section id="downloads"></section>

    <section id="faq"></section>

    <section id="related-chapters"></section>

</main>

<footer id="site-footer"></footer>

<script src="assets/js/chapter-loader.js" defer></script>

</body>
</html>
